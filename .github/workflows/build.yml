name: build

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: bash
        run: dotnet restore RimPulse.slnx 2>&1 | tee restore.log

      - name: Build
        shell: bash
        run: dotnet build RimPulse.slnx -c Release --no-restore 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: dotnet test RimPulse.slnx -c Release 2>&1 | tee test.log

      # Diagnostics are published as a commit comment because job logs and artifacts are not reachable
      # from every environment that needs to read them.
      - name: Report failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(mktemp)
          {
            echo "## CI failure report"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            for log in restore.log build.log test.log; do
              [ -f "$log" ] || continue
              echo "### $log (last 150 lines)"
              echo '```text'
              tail -150 "$log"
              echo '```'
              echo
            done
          } > "$report"

          jq -Rs '{body: .}' "$report" > payload.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input payload.json > /dev/null || true

          grep -nE 'error [A-Z]+[0-9]+|\[FAIL\]|Failed!|Process completed' "$report" | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0
